name: RosterIQ CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Tests & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database Migrations
        working-directory: backend
        run: |
          python -m alembic upgrade head

      - name: Seed Database
        working-directory: backend
        run: |
          python app/seed_data.py

      - name: Validate Seed Dataset
        working-directory: backend
        run: |
          python app/validate_seed_data.py

      - name: Execute Automated Backend Test Suite
        working-directory: backend
        run: |
          python -m pytest tests/test_scenarios.py tests/test_api_endpoints.py -v

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: pnpm install

      - name: Build Production Frontend
        working-directory: frontend
        run: pnpm build
